name: Windows Agent CI

on:
  pull_request:
  push:
    branches:
      - main
      - develop
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: windows-agent-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-test-package:
    runs-on: windows-latest
    timeout-minutes: 30

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
          cache: true
          cache-dependency-path: |
            **/*.csproj
            **/packages.lock.json

      - name: Install Inno Setup
        shell: pwsh
        run: choco install innosetup -y --no-progress

      - name: Determine development version
        id: version
        shell: pwsh
        run: |
          $version = "1.0.${{ github.run_number }}"
          "version=$version" >> $env:GITHUB_OUTPUT
          Write-Host "Build version: $version"

      # -AllowVersionMismatch: this job deliberately stamps a run-number version
      # (1.0.<run>) onto a throwaway PR installer, which cannot match
      # AgentInfo.Version. The release workflow does NOT pass it, so a release
      # tag whose code still carries the previous version still fails the build.
      - name: Build, test and package
        shell: pwsh
        run: .\build\build.ps1 -Version "${{ steps.version.outputs.version }}" -AllowVersionMismatch

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-results-${{ github.run_number }}
          path: TestResults/
          if-no-files-found: ignore
          retention-days: 14

      - name: Upload installer
        uses: actions/upload-artifact@v7
        with:
          name: tally-agent-installer-${{ steps.version.outputs.version }}
          path: |
            dist/Tally BigQuery Agent Setup.exe
            dist/Tally BigQuery Agent Setup.exe.sha256
          if-no-files-found: error
          retention-days: 30
